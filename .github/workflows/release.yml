name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Build
        run: |
          export CGO_ENABLED=0  # static on every target, incl. native amd64
          export GOARM=7  # only read when GOARCH=arm
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            out="dist/container-supervisor-${GOOS}-${GOARCH}"
            [ "$GOARCH" = arm ] && out="${out}v7"
            [ "$GOOS" = windows ] && out="$out.exe"
            go build -ldflags "-s -w" -o "$out" .
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
