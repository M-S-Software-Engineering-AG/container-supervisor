name: Daily scan

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.value }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name | select(startswith("release/"))' \
            | jq -Rnc '["main"] + [inputs]')
          echo "value=$list" >> "$GITHUB_OUTPUT"

  scan:
    needs: branches
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DETECTION_PRIORITY: comprehensive
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
