name: Renovate

on:
  schedule:
    - cron: '0 */4 * * *'
      timezone: 'Europe/Zurich'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}  # Renovate acts as the GitHub App, not GITHUB_TOKEN

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Resolve git author
        id: author
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "value=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: renovatebot/github-action@v46.3.13
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: ${{ steps.author.outputs.value }}
