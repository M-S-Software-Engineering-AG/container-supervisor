name: Auto release

on:
  push:
    branches: [main, 'release/**']

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Only for merged Renovate PRs
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
          [[ "$ref" == renovate/* ]] || { echo "not a Renovate merge ($ref), skipping"; exit 0; }
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --state open \
            --json headRefName,statusCheckRollup \
            --jq '[.[] | select(.headRefName | startswith("renovate/"))
                   | select(any(.statusCheckRollup[]; (.conclusion // .state) | IN("FAILURE","ERROR","CANCELLED","TIMED_OUT")) | not)] | length')
          [[ "$pending" == 0 ]] && echo "renovate=true" >> "$GITHUB_OUTPUT" || echo "$pending Renovate PR(s) still open, deferring release"
      - uses: actions/checkout@v7
        if: steps.check.outputs.renovate
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Tag next patch version
        if: steps.check.outputs.renovate
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v*')
          if git diff --quiet "$latest" HEAD -- . ':!.github'; then
            echo "no source changes since $latest, skipping"; exit 0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "$latest -> $next"
          git tag "$next"
          git push origin "$next"
